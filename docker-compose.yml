# ==============================================================================
# Docker Compose Orchestration: RecoNepal Client Advisory Portal
# ==============================================================================

services:
  # 1. PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: reconepal-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-reconepal}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - reconepal_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-reconepal}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - reconepal-network

  # 2. Express Backend API & Circular Dispatch Engine
  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: reconepal-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-reconepal}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      SMTP_HOST: ${SMTP_HOST:-smtp.example.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-noreply@example.com}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-changeme}
      SMTP_ENCRYPTION: ${SMTP_ENCRYPTION:-tls}
      SMTP_SENDER_EMAIL: ${SMTP_SENDER_EMAIL:-noreply@example.com}
      SMTP_SENDER_NAME: ${SMTP_SENDER_NAME:-RecoNepal}
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - reconepal-network

  # 3. Next.js Client Advisory Portal Frontend
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:4000/api}
    container_name: reconepal-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:4000/api}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - reconepal-network

volumes:
  reconepal_pgdata:
    name: reconepal_pgdata

networks:
  reconepal-network:
    name: reconepal-network
    driver: bridge
